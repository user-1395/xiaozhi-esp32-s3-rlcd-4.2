name: Build RLCD 4.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RLCD 4.2
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py waveshare/esp32-s3-rlcd-4.2 \
            --name esp32-s3-rlcd-4.2 \
            --language zh-CN \
            --wake-word nihaoxiaozhi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_esp32-s3-rlcd-4.2
          path: build/merged-binary.bin
          if-no-files-found: error
