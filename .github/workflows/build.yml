name: Build RLCD 4.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build RLCD 4.2 (zh-CN)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py waveshare/esp32-s3-rlcd-4.2 \
            --name waveshare-esp32-s3-rlcd-4.2 \
            --language zh-CN \
            --wake-word nihaoxiaozhi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rlcd42-merged
          path: build/merged-binary.bin
          if-no-files-found: error
